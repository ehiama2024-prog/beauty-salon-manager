<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BEAUTY SALON MANAGER</title>
  <meta name="description" content="Gestion de salon de coiffure : caisse, rendez-vous, clients, personnel, stock et finances.">
  <meta name="theme-color" content="#6b1d4f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Salon">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon"href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236b1d4f'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='%23f6d9e6'%3E%E2%9C%82%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Bibliothèques : graphiques (Chart.js) et PDF (jsPDF). L'application reste utilisable sans elles. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <!-- Écran de connexion / premier démarrage -->
  <div id="auth" class="auth-screen hidden"></div>

  <!-- Application -->
  <div id="app" class="app hidden">
    <div id="overlay-backdrop" class="backdrop"></div>

    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div id="brand-logo" class="logo-mark">✂</div>
        <div class="brand-text">
          <strong id="brand-name">Mon Salon</strong>
          <small>BEAUTY SALON MANAGER</small>
        </div>
      </div>
      <nav id="nav" class="nav" aria-label="Navigation principale"></nav>
      <div class="user-box">
        <div class="user-info">
          <strong id="user-name"></strong>
          <small id="user-role"></small>
        </div>
        <button id="logout-btn" class="btn ghost small" type="button">Déconnexion</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button id="menu-toggle" class="icon-btn menu-btn" type="button" aria-label="Ouvrir le menu">☰</button>
        <h1 id="page-title" class="topbar-title"></h1>
        <span id="topbar-date" class="topbar-date muted"></span>
      </header>
      <main id="page" class="page"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/db.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pages-a.js"></script>
  <script src="js/pages-b.js"></script>
  <!-- Hors connexion et installation : uniquement via http(s) ou localhost, pas en ouvrant le fichier directement -->
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
